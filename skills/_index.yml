shared_rules:
- Base URL is https://api.leanplum.com/api; the method travels in `action`, not the path.
- Every request carries appId, a permission-scoped clientKey, and apiVersion=1.0.6.
- HTTP 200 with success:true does NOT mean the action ran — always inspect
  response[].warning and response[].error.
- No idempotency key exists. Retry only 429 and 5xx, with exponential backoff
  (2s, 4s, 8s with jitter), and deduplicate client-side.
- Never issue concurrent requests for the same userId; strict device locking returns 429.
