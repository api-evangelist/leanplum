  https://docs.leanplum.com/reference/overview (SDK setup index)
description: >-
  First-party Leanplum client SDKs. Leanplum was acquired by CleverTap in 2022;
  the SDKs are still published from the Leanplum GitHub org and the same registry
  accounts (npm publisher `leanplum`, Maven group `com.leanplum`, CocoaPods pod
  `Leanplum-iOS-SDK`), and recent releases explicitly wrap the CleverTap SDKs to
  carry customers through the migration. There is no server-side / backend SDK for
  the REST API — Leanplum ships mobile and web client SDKs only, plus an official
  Postman collection and a Python API samples repo.
notes: >-
  Currency read from each registry's metadata endpoint on 2026-08-13. The Android
  (Maven) line last shipped 2025-03-13 and the iOS pod 2025-03-18, while the
  JavaScript and React Native packages shipped in late 2025 — the mobile SDKs are
  the older of the set. `com.leanplum:leanplum-mipush` is a release behind the rest
  of the Android family (7.4.1 vs 7.6.3).
