guardrails_if_built:
- >-
    sendMessage and startCampaign reach real end users. They should require
    human-in-the-loop confirmation; see agentic-access/leanplum-agentic-access.yml.
- >-
    The API has NO idempotency key. track/advance/sendMessage are append-only and a
    retried tool call double-writes. See conventions/leanplum-conventions.yml.
- >-
    HTTP 200 + success:true does not mean the action ran. A tool wrapper must inspect
    response[].error and response[].warning. See errors/leanplum-problem-types.yml.
- >-
    Do not issue concurrent calls for the same userId — strict device locking returns
    429. Batch per-user work through `multi` instead.
