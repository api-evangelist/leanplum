description: >-
  Leanplum (Leanplum by CleverTap) does not publish public self-serve pricing.
  It is sold as an enterprise mobile marketing and engagement platform through
  a sales-led motion, with plans scoped to monthly tracked/active users,
  message volume, channels enabled (push, in-app, email, web), and data
  retention/export needs. Since the 2022 CleverTap acquisition, commercial terms
  and renewals are increasingly handled through CleverTap as customers are
  migrated onto the CleverTap platform. The REST API itself is included with a
  platform subscription rather than priced separately, though multi/user lookups
  are metered as billable API calls.
notes: >-
  Re-checked 2026-08-13. There is no Leanplum-branded pricing page left:
  https://www.leanplum.com/pricing returns 200 after redirecting to
  https://clevertap.com/pricing/, so the pricing surface for the brand is now
  CleverTap's. That page publishes ONE self-serve tier — Essentials, listed at
  Rs.600/month promotional (from Rs.6,000/month), banded by MAU from 5,000 to
  100,000+, with a 30-day free trial — and two contact-sales tiers (Advanced,
  Cutting Edge) plus unpriced add-on modules (WhatsApp, Advanced Email, RCS,
  Promos). None of those tiers is scoped to Leanplum or to REST API access, so the
  two Leanplum entries below remain contact-sales and are NOT restated as CleverTap
  tiers. Prospective customers should confirm whether a new contract is written on
  Leanplum or migrated to CleverTap.
